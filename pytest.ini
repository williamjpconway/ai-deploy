[pytest]
testpaths = tests
pythonpath = . tests
markers =
    live: needs a real target VM (set AI_DEPLOY_TEST_TARGET)
    destructive: changes the target VM; needs --allow-destructive and operator confirmation
    live_ubuntu: needs a real Ubuntu target VM (set AI_DEPLOY_TEST_TARGET_UBUNTU)
    lab: needs a spec 009 test slot (set AI_DEPLOY_TEST_LAB_VMID) and the Proxmox token; optional
