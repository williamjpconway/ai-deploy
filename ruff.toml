line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S101: assert is how pytest tests are written.
# S603/S607: subprocess calls are the point of this tool; argv lists only, never shell=True.
ignore = ["S603", "S607"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
